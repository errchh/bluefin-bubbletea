---
name: Build installer ISO

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag of the image to build the ISO from"
        required: false
        default: "latest"
        type: string
  schedule:
    - cron: '05 10 1 * *'  # 10:05am UTC on the 1st of every month

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  RELEASE_TAG: "iso-latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build installer ISO
    runs-on: ubuntu-26.04

    permissions:
      contents: write  # create/update the rolling iso-latest release
      packages: read   # pull the source image from GHCR

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Prepare environment
        run: |
          IMAGE_TAG="${{ inputs.image_tag || 'latest' }}"
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG,,}" >> "$GITHUB_ENV"
          echo "ISO_NAME=${IMAGE_NAME,,}-${IMAGE_TAG,,}.iso" >> "$GITHUB_ENV"

      # Builds an Anaconda installer ISO that embeds the container image, so the
      # installed system works offline and rebases back onto GHCR afterwards.
      - name: Build ISO
        id: build
        uses: jasonn3/build-container-installer@bed71f841c250650a70f1ed8315ba92da1591ba6 # v1.5.0
        with:
          arch: x86_64
          version: "44"  # Fedora version of the installer, must match the base image
          variant: silverblue  # third item of fedora-release-* in the base image
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_name: ${{ env.IMAGE_NAME }}
          image_tag: ${{ env.IMAGE_TAG }}
          image_signed: "true"  # image is cosign-signed; Bluefin's policy.json accepts ghcr.io/errchh/*
          iso_name: ${{ env.ISO_NAME }}
          secure_boot_key_url: https://github.com/ublue-os/akmods/raw/main/certs/public_key.der
          enrollment_password: universalblue  # matches the Bluefin docs

      - name: Verify and split ISO
        id: split
        shell: bash
        run: |
          set -euox pipefail

          cd "${{ steps.build.outputs.iso_path }}"

          # The action writes sha256sum <iso> > <iso>-CHECKSUM
          sha256sum -c "${{ steps.build.outputs.iso_name }}-CHECKSUM"

          # GitHub caps release assets at 2 GiB, so split into parts well below that
          split -b 1900M -d -a 3 "${{ steps.build.outputs.iso_name }}" "${{ steps.build.outputs.iso_name }}."

          # Checksums for the parts, verified before reassembly
          sha256sum "${{ steps.build.outputs.iso_name }}."* > SHA256SUMS

          ls -lh

      - name: Publish to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dir="${{ steps.build.outputs.iso_path }}"
          cd "$dir"

          iso="${{ steps.build.outputs.iso_name }}"
          assets=( "$iso".* "$iso-CHECKSUM" SHA256SUMS )

          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Latest installer ISO" \
              --notes "Rolling release: replaced on every build. See below after the build completes."
          fi

          # Upload first, so a failure never leaves the release without an ISO
          gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"

          # Then drop leftovers from a previous build (e.g. an extra part)
          for asset in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
            if ! printf '%s\n' "${assets[@]}" | grep -qxF -- "$asset"; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done

          # Reassembly and verification instructions shown on the release page
          gh release edit "$RELEASE_TAG" --notes "$(cat <<EOF
          Rolling release — assets are replaced on every ISO build.

          ISO for \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\` (Fedora 44 / Silverblue), built from the image in GHCR.

          ### Download, reassemble, verify

          Download every asset in this release into one folder, then:

          \`\`\`bash
          # parts must keep this exact file name for the checksum to match
          cat ${ISO_NAME}.000 ${ISO_NAME}.001 ${ISO_NAME}.002 ... > ${ISO_NAME}

          # confirm the reassembled ISO (checksum covers the whole file)
          sha256sum -c ${ISO_NAME}-CHECKSUM

          # optional: confirm each part before assembling
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`

          The ISO embeds the container image, so installation works offline. Secure Boot key enrollment uses the Universal Blue key (password \`universalblue\`), as documented for Bluefin.
          EOF
          )"
